services:
  # ── RTSP Keepalive Proxy ──────────────────────────────────────────
  rtsp-proxy:
    build:
      context: .
      args:
        VERSION: "${VERSION:-dev}"
    image: rtsp-keepalive-proxy:latest
    container_name: rtsp-proxy
    restart: unless-stopped
    volumes:
      - ./config.yaml:/etc/rtsp-proxy/config.yaml:ro
      - ./data:/data   # last camera keyframes (must be writable by the container user)
    # No RTSP port is published: the RTSP output is unauthenticated and
    # re-serves your cameras. Frigate/go2rtc reach it on the shared Docker
    # network as rtsp://rtsp-proxy:8554/<name>. Publish 8554 only if a
    # consumer outside Docker needs it, and then firewall it.
    ports:
      - "127.0.0.1:8090:8080" # Health / status, local only
    environment:
      - TZ=Europe/Paris
      # Camera credentials (referenced in config.yaml via ${VAR})
      - CAM_USER=${CAM_USER:-admin}
      - CAM_PASS_JARDIN=${CAM_PASS_JARDIN}
      - CAM_PASS_ENTREE=${CAM_PASS_ENTREE}
    networks:
      - surveillance

  # ── Frigate NVR (reference – adapt to your setup) ─────────────────
  # frigate:
  #   image: ghcr.io/blakeblackshear/frigate:stable
  #   container_name: frigate
  #   restart: unless-stopped
  #   depends_on:
  #     - rtsp-proxy
  #   volumes:
  #     - ./frigate/config.yml:/config/config.yml:ro
  #     - /mnt/surveillance:/media/frigate
  #   ports:
  #     - "5000:5000"   # Web UI
  #     - "8971:8971"   # API
  #   devices:
  #     - /dev/bus/usb:/dev/bus/usb   # Coral TPU
  #     - /dev/dri/renderD128         # VAAPI
  #   environment:
  #     - TZ=Europe/Paris
  #     - FRIGATE_MQTT_USER=mqtt_user
  #     - FRIGATE_MQTT_PASSWORD=mqtt_pass
  #   networks:
  #     - surveillance

networks:
  surveillance:
    driver: bridge
